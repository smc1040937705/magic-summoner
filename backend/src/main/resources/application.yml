server:
  port: 8080

spring:
  application:
    name: magic-summoner
  
  datasource:
    url: jdbc:h2:mem:magicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: magicSummonerSecretKey2024ForJwtTokenGenerationAndValidation
  expiration: 86400000

# Game Configuration
game:
  max-hand-size: 10
  max-board-creatures: 5
  starting-health: 30
  starting-mana: 0
  max-mana: 10
  turn-time-limit: 120

# Logging
logging:
  level:
    com.magicsummoner: DEBUG
    org.springframework.web.socket: DEBUG
